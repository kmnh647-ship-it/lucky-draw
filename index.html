<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SP2S Global - Spin & Win Lucky Draw</title>
    <style>
        /* SP2S Global Black & Orange Premium Theme */
        :root {
            --brand-orange: #ff5e00;
            --brand-orange-hover: #ff7c24;
            --brand-orange-glow: rgba(255, 94, 0, 0.4);
            --bg-black: #080808;
            --card-black: #141414;
            --border-grey: #262626;
            --text-white: #ffffff;
            --text-muted: #8e8e93;
            --text-silver: #d1d1d6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        body {
            background-color: var(--bg-black);
            background-image: 
                radial-gradient(circle at 50% 30%, #201008 0%, var(--bg-black) 70%),
                linear-gradient(rgba(255, 94, 0, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 94, 0, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* Brand Header */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .brand-logo {
            font-size: 2.2rem;
            font-weight: 900;
            font-style: italic;
            color: var(--text-white);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .brand-logo span {
            color: var(--brand-orange);
            text-shadow: 0 0 20px var(--brand-orange-glow);
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-black);
            border: 1px solid var(--border-grey);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--brand-orange), transparent);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--text-white);
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Control Input Area */
        .control-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
            width: 100%;
        }

        .input-group {
            display: flex;
            width: 100%;
            max-width: 480px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-grey);
            background: #0d0d0d;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--brand-orange);
            box-shadow: 0 0 15px var(--brand-orange-glow);
        }

        .code-input {
            flex: 1;
            padding: 16px 20px;
            border: none;
            outline: none;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-white);
            background: transparent;
            letter-spacing: 1px;
            text-align: center;
        }

        .code-input::placeholder {
            color: #55555c;
            font-weight: normal;
            letter-spacing: 0;
        }

        .draw-btn {
            background: var(--brand-orange);
            color: var(--text-white);
            border: none;
            padding: 0 32px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .draw-btn:hover {
            background: var(--brand-orange-hover);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
        }

        .draw-btn:active {
            transform: scale(0.98);
        }

        .draw-btn:disabled {
            background: #222222;
            color: #55555c;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-message {
            color: #ff453a;
            font-size: 0.9rem;
            margin-top: -4px;
            min-height: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Turntable Outer Container */
        .wheel-outer {
            position: relative;
            width: 380px;
            height: 380px;
            margin: 0 auto 35px auto;
            border-radius: 50%;
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.9), 
                0 0 0 1px var(--border-grey),
                0 0 0 8px #141414,
                0 0 30px var(--brand-orange-glow);
            background: #101010;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 3.5s cubic-bezier(0.15, 0.85, 0.25, 1);
            transform: rotate(0deg);
        }

        /* Custom SVG Pointer Pointing From The Top */
        .pointer-container {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 48px;
            z-index: 100;
            filter: drop-shadow(0 4px 10px rgba(255, 94, 0, 0.5));
            pointer-events: none;
        }

        /* Bulbs flashing around outer ring */
        .bulbs-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        .bulb {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #fff;
            margin-top: -3px;
            margin-left: -3px;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            0% {
                background-color: var(--brand-orange);
                box-shadow: 0 0 4px var(--brand-orange), 0 0 10px var(--brand-orange);
            }
            100% {
                background-color: #ffffff;
                box-shadow: 0 0 4px #ffffff, 0 0 8px #ffffff;
            }
        }

        /* Winners Display Table */
        .info-section {
            width: 100%;
            margin-top: 20px;
            text-align: left;
        }

        .info-card {
            background: #0c0c0c;
            border: 1px solid var(--border-grey);
            border-radius: 16px;
            padding: 20px 25px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
        }

        .info-card h3 {
            font-size: 1.05rem;
            color: var(--text-white);
            margin-bottom: 15px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            border-bottom: 1px solid var(--border-grey);
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        .info-card h3 span {
            color: var(--brand-orange);
            font-size: 0.8rem;
        }

        .winners-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .winners-table th, .winners-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #1a1a1a;
        }

        .winners-table th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .winners-table td {
            color: var(--text-silver);
        }

        .winners-table tr:last-child td {
            border-bottom: none;
        }

        .prize-tag {
            color: var(--brand-orange);
            font-weight: 700;
        }

        /* Custom Modal / Popup overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: #111111;
            border: 2px solid var(--brand-orange);
            border-radius: 24px;
            padding: 40px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 94, 0, 0.25), inset 0 1px 0 rgba(255,255,255,0.05);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-title {
            color: var(--text-white);
            font-size: 1.6rem;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .modal-prize-desc {
            color: var(--brand-orange);
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .modal-prize {
            font-size: 2rem;
            color: var(--text-white);
            font-weight: 800;
            margin: 15px 0 25px 0;
            line-height: 1.3;
            text-shadow: 0 0 20px var(--brand-orange-glow);
        }

        .modal-btn {
            background: var(--brand-orange);
            color: var(--text-white);
            border: none;
            padding: 14px 40px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 4px 15px var(--brand-orange-glow);
        }

        .modal-btn:hover {
            background: var(--brand-orange-hover);
            transform: translateY(-2px);
        }

        /* Demo Testing & Reset Collapsible */
        .demo-controls {
            max-width: 650px;
            width: 100%;
            margin-top: 25px;
            background: #0a0a0a;
            border: 1px dashed #222222;
            border-radius: 14px;
            padding: 15px;
            text-align: left;
        }

        .demo-controls summary {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
            user-select: none;
        }

        .demo-controls summary:hover {
            color: var(--brand-orange);
        }

        .demo-details-content {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .demo-code-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
            gap: 6px;
            margin: 10px 0;
        }

        .demo-code-badge {
            background: #141414;
            border: 1px solid #222;
            color: var(--text-silver);
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .demo-code-badge:hover {
            border-color: var(--brand-orange);
            color: var(--brand-orange);
            background: #1e110a;
        }

        .reset-state-btn {
            background: transparent;
            border: 1px solid #333;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        .reset-state-btn:hover {
            border-color: #ff453a;
            color: #ff453a;
            background: rgba(255, 69, 58, 0.05);
        }

        /* 移动端强制适配补丁 */
        @media (max-width: 550px) {
            body { width: 100vw !important; padding: 10px !important; }
            .container { width: 95% !important; margin: 0 auto !important; padding: 15px !important; }
            .wheel-outer { width: 240px !important; height: 240px !important; }
            .winners-table { width: 100% !important; table-layout: fixed; }
            .winners-table th, .winners-table td { padding: 6px 2px !important; font-size: 11px !important; word-break: break-all; }
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <div class="brand-logo">SP2S<span> GLOBAL</span></div>
    </div>

    <div class="container">
        <h1>SPIN & WIN</h1>
        <p class="subtitle">Enter your exclusive draw code below to claim premium prizes from the SP2S campaign.</p>

        <div class="control-panel">
            <div class="input-group">
                <input type="text" id="codeInput" class="code-input" placeholder="Enter Draw Code Here..." autocomplete="off">
                <button id="drawBtn" class="draw-btn">Spin Now</button>
            </div>
            <div id="errorMsg" class="error-message"></div>
        </div>

        <div class="wheel-outer">
            <div class="pointer-container">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <path d="M50 95 L15 25 A35 35 0 0 1 85 25 Z" fill="#ff5e00" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
                    <circle cx="50" cy="40" r="14" fill="#ffffff"/>
                    <circle cx="50" cy="40" r="6" fill="#ff5e00"/>
                </svg>
            </div>
            <div class="bulbs-container" id="bulbs"></div>
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
        </div>

        <div class="info-section">
            <div class="info-card">
                <h3>🏆 Latest Winners <span>Live Draw</span></h3>
                <table class="winners-table">
                    <thead>
                        <tr>
                            <th>Ticket Code</th>
                            <th>Prize Won</th>
                            <th style="text-align: right;">Status</th>
                        </tr>
                    </thead>
                    <tbody id="winnersBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="demo-controls">
        <details>
            <summary>Developer Testing Tools (Demo Helper)</summary>
            <div class="demo-details-content">
                <div class="demo-code-grid" id="demoCodeGrid"></div>
                <button class="reset-state-btn" onclick="resetSystemState()">Reset Session State</button>
            </div>
        </details>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title" id="modalTitle">Congratulations!</div>
            <div class="modal-prize" id="modalPrize">Rp 1.00 Million Cash</div>
            <button class="modal-btn" id="modalCloseBtn">Claim Reward</button>
        </div>
    </div>

    <script>
        const MASTER_CODES = ['spM[+^](2*s', 'spZ?%**IN!s', 'sp1;[SF7FTs', 'sp4?MVYLTQs', 'spL8J[^?5Ps', 'spD(1UZC#Us', 'sp+M5L;E4Is', 'sp5F@)@Q8?s', 'sp|5-63|Y~s', 'sp)9?HY]RMs', 'sp%;|$DR17s', 'sp7RBZ4075s', 'sp{+$YEF)Ys', 'spO+]UVY76s', 'sp#V@R2([Bs', 'sp[B[KYOV)s', 'sp9I^*21Q]s', 'spXHNL:{[0s', 'spQK6TL+^Ts', 'spL0{SLU~[s'];
        let validCodes = JSON.parse(localStorage.getItem('sp2s_valid_codes')) || [...MASTER_CODES];
        let drawHistory = JSON.parse(localStorage.getItem('sp2s_draw_history')) || [];
        let quotas = JSON.parse(localStorage.getItem('sp2s_quotas')) || { prize1: 1, prize2: 2, prize3: 3, prize4: 4, prize5: 5 };
        let isSpinning = false;
        let currentRotation = 0;

        const sectors = [
            { id: 'prize1', text: '1st Prize', detail: 'Rp 1.00 Million Cash', color: '#ff5e00', textColor: '#ffffff' },
            { id: 'tryagain', text: 'Try Again', color: '#0c0c0c', textColor: '#8e8e93' },
            { id: 'prize3', text: '3rd Prize', detail: 'SEN X Device + 1 Pod', color: '#161616', textColor: '#ff5e00' },
            { id: 'tryagain', text: 'Try Again', color: '#0c0c0c', textColor: '#8e8e93' },
            { id: 'prize2', text: '2nd Prize', detail: 'Rp 750 Thousand Cash', color: '#ff5e00', textColor: '#ffffff' },
            { id: 'tryagain', text: 'Try Again', color: '#0c0c0c', textColor: '#8e8e93' },
            { id: 'prize4', text: '4th Prize', detail: '3 Pods Pack', color: '#161616', textColor: '#ff5e00' },
            { id: 'prize5', text: '5th Prize', detail: 'SP2S Exclusive Merchandise', color: '#222222', textColor: '#ffffff' }
        ];

        function triggerDraw() {
            if (isSpinning) return;
            const inputVal = document.getElementById('codeInput').value.trim();
            const codeIndex = validCodes.indexOf(inputVal);

            if (codeIndex === -1) {
                document.getElementById('errorMsg').textContent = 'Invalid promo code or already used!';
                return;
            }

            // --- 核心修改：防重逻辑 ---
            validCodes.splice(codeIndex, 1);
            localStorage.setItem('sp2s_valid_codes', JSON.stringify(validCodes));
            // -----------------------

            isSpinning = true;
            document.getElementById('drawBtn').disabled = true;
            
            // 原有动画逻辑 (此处假设你原有计算奖项逻辑为 getPrize)
            const targetSectorIndex = Math.floor(Math.random() * sectors.length);
            const alignAngle = 360 - (targetSectorIndex * 45 + 22.5);
            currentRotation += 2160 + alignAngle;
            document.getElementById('wheelCanvas').style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                document.getElementById('drawBtn').disabled = false;
                alert('抽奖完成，码已核销');
                location.reload();
            }, 3500);
        }

        document.getElementById('drawBtn').addEventListener('click', triggerDraw);
        // ... 其他原有初始化和渲染函数保持不变 ...
        drawWheel(); // 确保保留原有绘图逻辑
    </script>
</body>
</html>
